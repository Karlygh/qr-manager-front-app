<div class="container mt-4">
    <h2 class="mb-4">Administrar Redes Sociales</h2>
    
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="isLoading" class="text-center p-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <ng-container *ngIf="!isLoading">
        <div class="card p-3 mb-4 shadow-sm">
            <h5 class="card-title">Añadir Nueva Red</h5>
            <form (ngSubmit)="addNetwork()" class="row g-3">
                <div class="col-md-4">
                    <input type="text" [(ngModel)]="newNetwork.name" name="name" class="form-control" placeholder="Nombre (ej: Instagram)" required>
                </div>
                <div class="col-md-6">
                    <input type="url" [(ngModel)]="newNetwork.url" name="url" class="form-control" placeholder="URL completa (ej: https://...)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100" [disabled]="!newNetwork.name || !newNetwork.url">
                        <i class="bi bi-plus-circle-fill"></i> Añadir
                    </button>
                </div>
            </form>
        </div>

        <div class="card p-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Redes Configuradas ({{ socialNetworks.length }})</h5>
                
                <button (click)="toggleEditing()" class="btn btn-sm" [ngClass]="{'btn-success': isEditing, 'btn-outline-primary': !isEditing}">
                    <i class="bi" [ngClass]="{'bi-save': isEditing, 'bi-pencil': !isEditing}"></i> 
                    {{ isEditing ? 'Guardar Cambios' : 'Modificar Lista' }}
                </button>
            </div>

            <div *ngIf="socialNetworks.length === 0" class="text-muted small">
                Aún no hay redes sociales configuradas para este negocio.
            </div>

            <ul *ngIf="socialNetworks.length > 0" class="list-group list-group-flush">
                <li *ngFor="let network of socialNetworks" class="list-group-item d-flex align-items-center">
                    
                    <span class="fw-bold me-3 text-truncate" style="min-width: 100px;">
                        {{ network.name }}
                    </span>
                    
                    <input *ngIf="isEditing" type="url" [(ngModel)]="network.url" [ngModelOptions]="{standalone: true}" class="form-control form-control-sm me-3 flex-grow-1">
                    
                    <a *ngIf="!isEditing" [href]="network.url" target="_blank" class="text-primary text-truncate flex-grow-1 me-3 small">
                        {{ network.url }}
                    </a>

                    <button *ngIf="isEditing && network.id" (click)="deleteNetwork(network.id)" class="btn btn-outline-danger btn-sm ms-2" title="Eliminar">
                        <i class="bi bi-trash"></i>
                    </button>
                </li>
            </ul>
        </div>
    </ng-container>
</div>
