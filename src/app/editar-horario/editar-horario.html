<div class="kitchen-schedule-container">
  <h2>Horarios de Cocina</h2>
  
  <div class="schedule-grid">
    <div class="schedule-item" *ngFor="let schedule of kitchenHours; let i = index">
      <div class="day-header">
        <h3>{{ getDayName(schedule.day) }}</h3>
      </div>
      
      <div class="time-inputs">
        <div class="input-group">
          <label>Apertura:</label>
          <input 
            type="time" 
            [(ngModel)]="schedule.openingTime"
            (change)="onTimeChange(i)"
            class="time-input">
        </div>
        
        <div class="input-group">
          <label>Cierre:</label>
          <input 
            type="time" 
            [(ngModel)]="schedule.closingTime"
            (change)="onTimeChange(i)"
            class="time-input">
        </div>
      </div>
      

    </div>
  </div>
  
  <div class="global-actions">
    <button 
      (click)="saveAllSchedules()" 
      [disabled]="loading"
      class="btn btn-save">
      {{ loading ? 'Guardando...' : 'Guardar Todos' }}
    </button>
    
    <button 
      (click)="deleteAllSchedules()"
      class="btn btn-delete-all">
      Resetear
    </button>
  </div>
</div>
