<main aria-label="Preguntas Frecuentes y Garantías">

  <!-- ======================
       SECCIÓN FAQ
  ====================== -->
  <section class="pricing-faq py-5">
    <div class="container">
      <h2 class="text-center fw-bold mb-4 titulo-dos">Preguntas Frecuentes</h2>

      <div class="accordion" id="faqAccordion">
        @for (item of faqs; track item.question; let i = $index) {
          <div class="accordion-item">
            <h2 class="accordion-header" [id]="'faqHeader' + i">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                      [attr.data-bs-target]="'#faqItem' + i" aria-expanded="false" [attr.aria-controls]="'faqItem' + i">
                {{ item.question }}
              </button>
            </h2>
            <div [id]="'faqItem' + i" class="accordion-collapse collapse" data-bs-parent="#faqAccordion" 
                 [attr.aria-labelledby]="'faqHeader' + i">
              <div class="accordion-body">
                {{ item.answer }}
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- ======================
       SECCIÓN POR QUÉ ELEGIRNOS
  ====================== -->
  <section class="why-us py-5">
    <div class="container">
      <h2 class="text-center fw-bold mb-5 titulo-uno">¿Por qué elegirnos?</h2>

      <div class="row g-4">
        @for (item of whyUs; track item.title; let i = $index) {
          <div class="col-md-4">
            <div class="accordion">
              <div class="accordion-item">
                <h2 class="accordion-header" [id]="'whyHeader' + i">
                  <button class="accordion-button collapsed text-center" type="button" data-bs-toggle="collapse" 
                          [attr.data-bs-target]="'#whyItem' + i" aria-expanded="false" [attr.aria-controls]="'whyItem' + i">
                    <div class="w-100">
                      <h4 class="fw-bold mb-2">{{ item.title }}</h4>
                      <p class="mb-0">{{ item.description }}</p>
                    </div>
                  </button>
                </h2>
                <div [id]="'whyItem' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'whyHeader' + i">
                  <div class="accordion-body">
                    {{ item.detail }}
                  </div>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- ======================
       SECCIÓN GARANTÍAS
  ====================== -->
  <section class="guarantees py-5">
    <div class="container text-center">
      <h2 class="fw-bold mb-4 titulo-uno mt-4">Garantías</h2>

      <div class="row g-4 justify-content-center guarantees-row">
        @for (item of guarantees; track item.title; let i = $index) {
          <div class="col-md-4">
            <div class="accordion">
              <div class="accordion-item">
                <h2 class="accordion-header" [id]="'guaranteeHeader' + i">
                  <button class="accordion-button collapsed text-center" type="button" data-bs-toggle="collapse" 
                          [attr.data-bs-target]="'#guaranteeItem' + i" aria-expanded="false" [attr.aria-controls]="'guaranteeItem' + i">
                    <div class="w-100">
                      <h4 class="fw-bold mb-2">{{ item.title }}</h4>
                      <p class="mb-0">{{ item.description }}</p>
                    </div>
                  </button>
                </h2>
                <div [id]="'guaranteeItem' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'guaranteeHeader' + i">
                  <div class="accordion-body">
                    {{ item.detail }}
                  </div>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </section>

</main>
