<section class="recafy-steps-section py-5 mt-1">
    <div class="container">
        
        <header class="text-center mb-5">
            <h2 class="section-title fw-bold">Simplifica tu negocio: Tu Carta QR en solo <span class="highlight-steps">4 pasos</span></h2>
            <p class="section-subtitle lead mt-3">Digitaliza tu negocio de hostelería sin complicaciones y en cuestión de minutos.</p>
        </header>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
            
            <div class="col" *ngFor="let step of steps">
                <div class="step-card p-4 h-100">
                    <img 
                        [src]="step.imageUrl" 
                        [alt]="step.imageAlt" 
                        (error)="handleImageError($event)"
                        loading="lazy"
                        class="step-image mb-3 img-fluid">
                    <div class="step-number">{{ step.number }}</div>
                    <h3 class="step-title h5 fw-bold mt-3 mb-2">{{ step.title }}</h3>
                    <p class="step-description">{{ step.description }}</p>
                </div>
            </div>

        </div>
        
        <div class="text-center mt-5">
            <a routerLink="/crear-negocio" class="cta-button primary">Comienza hoy</a>
        </div>
        
    </div>
</section>
