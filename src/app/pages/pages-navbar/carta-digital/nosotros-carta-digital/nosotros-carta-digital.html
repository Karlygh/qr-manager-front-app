<section class="padding-section-large section-qrmanager">
  <div class="container">

    <h2 class="section-title text-center mb-5">
      ¿Por qué los mejores restaurantes usan QR-Manager?
    </h2>

    <div class="row g-4">

      <!-- TARJETAS DINÁMICAS -->
      <div 
        *ngFor="let card of cards; let i = index"
        class="col-md-4"
        role="article"
        [attr.aria-label]="'Característica ' + (i + 1) + ': ' + card.title"
      >
        <div class="qr-card h-100">
          <!-- CONTENIDO -->
          <div class="qr-card-body">
            <h3 class="qr-card-title">{{ card.title }}</h3>
            <p class="qr-card-text">
              {{ card.description }}
            </p>
          </div>

          <!-- IMAGEN -->
          <img 
            [src]="card.imageUrl"
            [alt]="card.imageAlt"
            class="qr-card-img"
            (error)="handleImageError($event)"
            loading="lazy"
          >
        </div>
      </div>

    </div>

  </div>
</section>
