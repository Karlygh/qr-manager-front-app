<form class="login-form" (ngSubmit)="onSubmit()">

  @if (errorMessage) {
    <div class="alert-error">
      ⚠️ {{ errorMessage }}
    </div>
  }

  <div class="form-group">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      id="email"
      class="form-control"
      placeholder="tu@email.com"
      [(ngModel)]="email"
      name="email"
      required>
  </div>

  <div class="form-group">
    <label for="password" class="form-label">Contraseña</label>
    <input
      type="password"
      id="password"
      class="form-control"
      placeholder="••••••••"
      [(ngModel)]="password"
      name="password"
      required>
  </div>

  <div class="form-options">
    <a class="forgot-password" routerLink="/recuperar-contraseña">¿Olvidaste la contraseña?</a>
  </div>

  <button type="submit" class="btn-login">
    {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
  </button>

</form>
