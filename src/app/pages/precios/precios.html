<section class="landing-prices py-5">
  <div class="container">

    <h2 class="text-center fw-bold mb-3">Nuestros Planes</h2>

    <div class="text-center mb-5">
      <div class="switch-toggle" [class.active]="isYearly" (click)="togglePricing()">
        <span class="me-2">Mensual</span>
        <span class="slider"></span>
        <span class="ms-2">Anual</span>
      </div>

      <p *ngIf="!isYearly" class="text-muted mt-2 small">
        Cambia a Anual y ahorra
      </p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let plan of plans">
        <div class="price-card p-4 shadow-sm h-100"
             [ngClass]="{
               'featured': plan.isFeatured,
               'premium': plan.name === 'Premium'
             }">
          
          <h3 class="fw-bold mb-3 text-center">{{ plan.name }}</h3>
          
          <p class="price text-center fw-bold">
            {{ getCurrentPrice(plan) }}
          </p>

          <div *ngIf="isYearly" class="text-center mb-3">
              <p class="small text-muted mb-1">
                  <span class="price-badge me-1">{{ plan.freeMonths }} meses GRATIS</span>
              </p>
              <p class="small fw-bold mb-0 annual-price-highlight"> 
                  En anual te sale a {{ getAnnualInfo(plan).total }}
              </p>
              <p class="small text-muted">
                  (Equivale a {{ getAnnualInfo(plan).monthlyEquivalent }})
              </p>
          </div>

          <ul class="list-unstyled mt-3">
            <li *ngFor="let feature of plan.features">{{ feature }}</li>
          </ul>

          <div class="text-center mt-4">
            <button class="btn w-100" 
                    [ngClass]="{'btn-dark': plan.isFeatured, 'btn-primary': !plan.isFeatured}">
              Elegir Plan
            </button>
          </div>

        </div>
      </div>
    </div>
    
  </div>
</section>

<app-preguntas-frecuentes *ngIf="mostrarFaqs"></app-preguntas-frecuentes>
