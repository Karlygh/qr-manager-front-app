<div class="container">
  <!-- Header -->
  <header class="header">
    <button class="btn-back" (click)="volverAlPanel()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1 class="title">Productos</h1>
  </header>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading-container">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error() && !isLoading()" class="error-container">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p>{{ error() }}</p>
    <button class="btn-retry" (click)="cargarProductos()">Reintentar</button>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && !error() && productos().length === 0" class="empty-container">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
    </svg>
    <p>No hay productos creados</p>
  </div>

  <!-- Product Grid -->
  <div *ngIf="!isLoading() && !error() && productos().length > 0" class="productos-grid">
    <div 
      *ngFor="let producto of productos()" 
      class="producto-card"
      (click)="editarProducto(producto)"
    >
      <div class="producto-image-container">
        <img 
          *ngIf="producto.image" 
          [src]="producto.image" 
          [alt]="producto.name"
          class="producto-image"
        />
        <div *ngIf="!producto.image" class="producto-image-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
      </div>
      <div class="producto-info">
        <h3 class="producto-nombre">{{ producto.name }}</h3>
        <svg class="icon-edit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
    </div>
  </div>
</div>
