<div class="detalles-container">
  
  <div *ngIf="cargando" class="loading-message">
    Cargando detalles del negocio...
  </div>

  <div *ngIf="!cargando && negocio" class="negocio-card">

    <!-- Encabezado -->
    <div class="card-header">
      <h3 class="header-title">Detalles del Negocio</h3>
      <span class="id-badge">ID: {{ negocio.id }}</span>
    </div>

    <!-- Contenido -->
    <div class="card-body">

      <!-- Nombre del negocio -->
      <h2 class="business-name">{{ negocio.name }}</h2>

      <!-- Descripción -->
      <div *ngIf="negocio.description" class="info-block">
        <span class="label">Descripción</span>
        <p class="value">{{ negocio.description }}</p>
      </div>

      <div class="divider"></div>

      <!-- Datos de contacto -->
      <h5 class="section-title">Datos de contacto</h5>

      <div class="contact-grid">
        <div class="info-block">
          <span class="label">Email</span>
          <p class="value">{{ negocio.email }}</p>
        </div>

        <div class="info-block">
          <span class="label">Teléfono</span>
          <p class="value" *ngIf="negocio.phoneNumber; else noPhone">
            {{ negocio.phoneNumber }}
          </p>
          <ng-template #noPhone>
            <p class="value muted">No especificado</p>
          </ng-template>
        </div>
      </div>

      <div class="info-block">
        <span class="label">Dirección</span>
        <p class="value">{{ negocio.address }}</p>
      </div>

      <!-- Botón -->
      <div class="action-container">
        <a [routerLink]="['/panel-control-business', negocio.id]" class="btn-panel">
          Ir al Panel de Control
        </a>
      </div>

    </div>
  </div>
</div>
