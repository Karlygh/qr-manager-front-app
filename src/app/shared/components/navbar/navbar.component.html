<nav class="navbar navbar-expand-lg navbar-light shadow-sm py-3 sticky-top custom-navbar">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    
    <a class="navbar-brand d-flex align-items-center fw-bold fs-4 rounded" routerLink="/home" (click)="closeMenu()">
      <img src="assets/mockup/logo2.png" alt="Logo" class="me-2 rounded navbar-logo">
      <span class="brand-text d-none d-sm-inline-block">QR-Manager</span>
    </a>

    <button class="navbar-toggler" type="button" 
      [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" [class.show]="isMenuOpen()">
      <ul class="navbar-nav">
        @for (item of navItems; track item.path) {
          <li class="nav-item mx-2">
            <a class="nav-link" 
               [routerLink]="item.path" 
               routerLinkActive="active" 
               [routerLinkActiveOptions]="{exact: item.exact ?? false}" 
               (click)="closeMenu()">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>

      <div class="d-flex justify-content-center justify-content-lg-start ms-lg-3 mt-3 mt-lg-0">
        <a routerLink="/crear-negocio" class="btn btn-primary px-4 rounded-pill me-2" (click)="closeMenu()">Comienza gratis</a>
        <a routerLink="/login" class="custom-button" (click)="closeMenu()">Iniciar sesión</a>
      </div>

    </div>
  </div>
</nav>
