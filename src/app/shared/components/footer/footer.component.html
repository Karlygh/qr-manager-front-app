<footer class="qr-footer">
  <div class="qr-footer-container">
    
    <!-- Logo y Redes Sociales -->
    <div class="qr-footer-column">
      <a href="/" class="qr-logo-brand">QR-MANAGER</a>
      <p class="qr-slogan">Digitaliza tu menú. Simplifica la experiencia.</p>
      
      <div class="qr-social-icons">
        <a [href]="facebook" target="_blank" rel="noopener" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a [href]="twitter" target="_blank" rel="noopener" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a [href]="instagram" target="_blank" rel="noopener" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
      </div>
    </div>

    <!-- Información Rápida -->
    <div class="qr-footer-column">
      <h5>Información Rápida</h5>
      <a routerLink="/" class="qr-link" [class.link-active]="isCurrentRoute('/')">
        Home
      </a>
      <a routerLink="/restaurante" class="qr-link" [class.link-active]="isCurrentRoute('/restaurante')">
        Tu Restaurante
      </a>
      <a routerLink="/precios" class="qr-link" [class.link-active]="isCurrentRoute('/precios')">
        Precios
      </a>
      <a routerLink="/faq" class="qr-link" [class.link-active]="isCurrentRoute('/faq')">
        Preguntas Frecuentes
      </a>
    </div>

    <!-- Soporte y Legal -->
    <div class="qr-footer-column">
      <h5>Soporte</h5>
      <a routerLink="/contacto" class="qr-link" [class.link-active]="isCurrentRoute('/contacto')">
        Contacto
      </a>
      <a routerLink="/terminos" class="qr-link" [class.link-active]="isCurrentRoute('/terminos')">
        Términos de Servicio
      </a>
      <a routerLink="/privacidad" class="qr-link" [class.link-active]="isCurrentRoute('/privacidad')">
        Política de Privacidad
      </a>
      
      <!-- Contacto Dinámico -->
      <div class="qr-contact-item" *ngFor="let item of contactItems">
        <a [href]="item.url" class="qr-link" target="_blank" rel="noopener">
          {{ item.label }}
        </a>
      </div>
    </div>

  </div>

  <!-- Copyright -->
  <div class="qr-footer-bottom">
    <hr class="qr-separator">
    <p class="qr-copyright">
      &copy; {{ currentYear }} QR MANAGER. Todos los derechos reservados.
    </p>
  </div>
</footer>
