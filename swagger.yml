openapi: 3.0.3
info:
  title: Auth Manager API
  description: |
    API for authentication.
  version: 1.0.0
  contact:
    email: support@cleancoderscadiz.com

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: auth
    description: auth operations

paths:
  /api/v1/auth-manager/auth/register:
    post:
      tags:
        - auth
      summary: Register new user
      description: |
        Registers a new user into Keycloak through the auth-manager.
        Returns the created Keycloak user ID.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error in input data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error communicating with Keycloak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth-manager/auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: |
        Logs a user through Keycloak and returns access and refresh tokens.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Keycloak error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth-manager/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: |
        Exchanges a refresh token for a new access token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Token renewed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Keycloak error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth-manager/auth/logout:
    post:
      tags:
        - auth
      summary: User logout
      description: |
        Invalidates the user's refresh token in Keycloak.
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout successful.
        '401':
          description: Invalid refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Keycloak error during logout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - secondLastName
        - postalCode
        - address
        - city
        - country
        - locality
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "Temporal01"
          description: "Password is only sent to Keycloak and never stored in the backend database."
        firstName:
          type: string
          example: "Juan"
        lastName:
          type: string
          example: "Pérez"
        secondLastName:
          type: string
          example: "Reverte"
        phone:
          type: string
          example: "+34600111222"
        postalCode:
          type: string
          example: "+34600111222"
        address:
          type: string
          example: "Barriada Bacana n3 1b"
        city:
          type: string
          example: "Cádiz"
        locality:
          type: string
          example: Chiclana de la Frontera
        country:
          type: string
          example: "España"

    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          description: ID from Keycloak
          example: "7c4a76c7-eaa1-4abf-91f8-d134879e3a91"
        message:
          type: string
          example: "User successfully registered."

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "user@example.com"
        password:
          type: string
          example: "Temporal01"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Refresh token from Keycloak
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          example: 3600
        refreshExpiresIn:
          type: integer
          example: 18000

    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 500
        message:
          type: string
          example: "Entity not found"
        details:
          type: string
          example: "The entity with the given ID does not exist."
