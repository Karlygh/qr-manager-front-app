openapi: 3.0.3
info:
  title: Business Manager API
  description: |
    API for managing businesses, products, schedules, allergens, and more.
  version: 1.0.0
  contact:
    email: support@businessmanager.com

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: business
    description: Business operations
  - name: product
    description: Menu product management
  - name: allergen
    description: Allergen management
  - name: category
    description: Categories
  - name: subcategory
    description: Subcategories
  - name: schedule_opening
    description: Opening hours
  - name: schedule_kitchen
    description: Kitchen hours
  - name: facilities
    description: Business facilities
  - name: wifi
    description: WiFi information
  - name: social_network
    description: Business social networks

paths:
  /api/v1/business:
    get:
      tags: [business]
      summary: Retrieve all business (paginated)
      operationId: getAllBusiness
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0

        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10

        - name: name
          in: query
          required: false
          schema:
            type: string
          example: "Café Central"
          description: Filter by partial or full business name

        - name: createdAtFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2025-08-01"
          description: Minimum creation date (inclusive)

        - name: createdAtTo
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2025-08-10"
          description: Maximum creation date (exclusive)

      responses:
        '200':
          description: Page of business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBusinessResponse'
    post:
      tags: [business]
      summary: Create new business
      operationId: createBusiness
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
      responses:
        '201':
          description: Business created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponse'
        '500':
          description: The business could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/business/{businessId}:
    get:
      tags: [business]
      summary: Obtain the business by id
      operationId: getBusinessById
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Business Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponse'
        '500':
          description: The business could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [business]
      summary: Update a business by id
      operationId: updateBusinessById
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
      responses:
        '200':
          description: Business updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponse'
        '500':
          description: The business could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [business]
      summary: Delete a businnes by id
      operationId: deleteBusinessById
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Business deleted successfully
        '500':
          description: The business could not be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/business/{businessId}/products:
    get:
      tags: [business]
      summary: Get all products of a business by the business id
      operationId: getBusinessProductsById
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Products of a business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessWithProductsResponse'
        '500':
          description: The business products could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products:
    get:
      tags: [product]
      summary: Retrieve all products
      description: Returns a list of all available products.
      operationId: getAllProducts
      responses:
        '200':
          description: Retrieved product list successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [product]
      summary: Create new product
      description: Creates a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                businessId:
                  type: integer
                  format: int64
                name:
                  type: string
                price:
                  type: number
                  format: float
                image:
                  type: string
                  format: binary
                description:
                  type: string
                label:
                  type: string
                status:
                  type: boolean
                categoryId:
                  type: integer
                  format: int64
                subcategoryId:
                  type: integer
                  format: int64
                allergenIds:
                  type: string
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid input
        '409':
          description: Product already exists
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products/{productId}:
    get:
      tags: [product]
      summary: Obtain the product by id
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Retrieved product successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          description: Product couldn't be obtained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [product]
      summary: Update a product by ID
      operationId: updateProductById
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          description: The product couldn't be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [product]
      summary: Delete product by ID
      operationId: deleteProductById
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product eliminated successfully
        '500':
          description: Failed to eliminate product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/allergens:
    get:
      tags: [allergen]
      summary: Obtain all the allergens for a dropdown.
      operationId: getListOfAllergerns
      responses:
        '200':
          description: Returned list of allergens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllergenResponse'
        '500':
          description: Failed to load the list of allergens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/product/allergens/{productId}:
    get:
      tags: [allergen]
      summary: Obtain allergens associated with the product when shown in menu.
      operationId: getAllergensForProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Correctly returned list of allergens for product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllergenResponse'
        '500':
          description: Failed to obtain list of allergens for product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [ allergen ]
      summary: Remove multiple allergens from a product
      operationId: deleteMultipleAllergensByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: allergenIds
          in: query
          required: true
          explode: true
          style: form
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '204':
          description: Allergens successfully removed
        '404':
          description: Product or some allergens not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/product/{productId}/allergens/{allergenId}:
    delete:
      tags: [allergen]
      summary: Remove one allergen from a product.
      operationId: deleteAllergenFromProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: allergenId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Allergen successfully removed
        '404':
          description: Product or allergen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/category/{id}:
    get:
      tags: [category]
      summary: Obtain category by id
      operationId: getCategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Category details obatained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '500':
          description: Error obtaining category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [ category ]
      summary: Create a category with business id
      operationId: createCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '500':
          description: Failed to create category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [category]
      summary: Update a category
      operationId: updateCategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '500':
          description: Failed to update the category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [category]
      summary: Eliminate a category by ID
      operationId: deleteCategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Category eliminated successfully

  /api/v1/category/all/{businessId}:
    get:
      tags: [ category ]
      summary: Get call the categories
      operationId: getAllCategoriesByBusinessId
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of categories obtained successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '500':
          description: Failed to obtain the list of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/subcategory:
    post:
      tags: [subcategory]
      summary: Create a new subcategory
      operationId: createSubCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCategoryRequest'
      responses:
        '201':
          description: Successfully created subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCategoryResponse'
        '500':
          description: Failed to create a subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subcategory/{subCategoryId}:
    patch:
      tags: [subcategory]
      summary: Update subcategory
      operationId: updateSubCategoryById
      parameters:
        - name: subCategoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCategoryRequest'
      responses:
        '200':
          description: Successfully updated subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCategoryResponse'
        '500':
          description: Failed to update subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [subcategory]
      summary: Delete a subcategory
      operationId: deleteSubCategoryById
      parameters:
        - name: subCategoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successfully deleted subcategory
        '500':
          description: Failed to delete subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subcategory/{categoryId}:
    get:
      tags: [subcategory]
      summary: Get call the subcategories by category Id
      operationId: getAllSubCategoriesByCategoryId
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of subcategories obtained successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCategoryResponse'
        '500':
          description: Failed to obtain the list of subcategories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [subcategory]
      summary: Delete all subcategories by category Id
      operationId: deleteAllSubCategoriesByCategoryId
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: All subcategories deleted successfully by category ID
        '500':
          description: Couldn't delete all subcategories by category ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/subcategory/business/{businessId}:
    get:
      tags: [subcategory]
      summary: Get all the subcategories by business Id
      operationId: getAllSubCategoriesByBusinessId
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of all subcategories obtained successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCategoryResponse'
        '500':
          description: Failed to obtain the list of subcategories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/opening-hours/{businessId}:
    get:
      tags: [schedule_opening]
      summary: Retrieve schedule from a specific business
      operationId: findAllOpeningHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Lista de horarios de apertura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpeningHourResponse'
        '500':
          description: No se han podido obtener los horarios de apertura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [schedule_opening]
      summary: Save schedule
      operationId: saveOpeningHour
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHourRequest'
      responses:
        '201':
          description: Horario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHourResponse'
        '500':
          description: No se ha podido crear el horario de apertura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/opening-hours/all/{businessId}:
    post:
      tags: [ schedule_opening ]
      summary: Save all opening hours
      operationId: saveOpeningHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OpeningHourRequest'
      responses:
        '201':
          description: Opening hours created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpeningHourResponse'
        '500':
          description: Failed to create opening hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [schedule_opening]
      summary: Delete all opening hours
      operationId: deleteOpeningHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Opening hours deleted successfully
        '500':
          description: Failed to delete opening hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/schedule/opening-hours/{id}:
    patch:
      tags: [schedule_opening]
      summary: Update schedule
      operationId: updateOpeningHour
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHourRequest'
      responses:
        '200':
          description: Horario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHourResponse'
        '500':
          description: No se ha podido actualizar el horario de apertura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [schedule_opening]
      summary: Delete schedule
      operationId: deleteOpeningHour
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Horario eliminado correctamente
        '500':
          description: No se ha podido eliminar el horario de apertura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/kitchen-hours/{businessId}:
    get:
      tags: [schedule_kitchen]
      summary: Retrieve kitchen schedule from a specific business
      operationId: findAllKitchenHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de horarios de cocina
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KitchenHourResponse'
        '500':
          description: No se han podido obtener los horarios de cocina
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [schedule_kitchen]
      summary: Crear horario de cocina
      operationId: saveKitchenHour
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenHourRequest'
      responses:
        '201':
          description: Horario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenHourResponse'
        '500':
          description: No se ha podido crear el horario de cocina
          content:
            application/json:
              schema:

                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/kitchen-hours/all/{businessId}:
    post:
      tags: [ schedule_kitchen ]
      summary: Save all kitchen hours
      operationId: saveKitchenHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/KitchenHourRequest'
      responses:
        '201':
          description: Kitchen hours created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KitchenHourResponse'
        '500':
          description: Failed to create kitchen hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [schedule_kitchen]
      summary: Delete all kitchen hours
      operationId: deleteKitchenHours
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Kitchen hours deleted successfully
        '500':
          description: Failed to delete kitchen hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/kitchen-hours/{id}:
    patch:
      tags: [schedule_kitchen]
      summary: Actualizar horario de cocina
      operationId: updateKitchenHour
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenHourRequest'
      responses:
        '200':
          description: Horario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenHourResponse'
        '500':
          description: No se ha podido actualizar el horario de cocina
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [schedule_kitchen]
      summary: Eliminar horario de cocina
      operationId: deleteKitchenHour
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Horario eliminado correctamente
        '500':
          description: No se ha podido eliminar el horario de cocina
          content:
            application/json:
