components:
  schemas:
    BusinessRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: "Café Central"
        address:
          type: string
          maxLength: 150
          example: "Calle Mayor 123, Madrid"
        phoneNumber:
          type: string
          maxLength: 20
          example: "+34 600 123 456"
        email:
          type: string
          maxLength: 100
          example: "contacto@cafecentral.es"
        description:
          type: string
          maxLength: 500
          example: "Cafetería acogedora con productos ecológicos."
        imageLogo:
          type: string
          format: binary
          example: photo.jpg
        oldImageLogo:
          type: string
          example: photo.jpg

    BusinessResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 100
          example: "Café Central"
        address:
          type: string
          maxLength: 150
          example: "Calle Mayor 123, Madrid"
        phoneNumber:
          type: string
          maxLength: 20
          example: "+34 600 123 456"
        email:
          type: string
          maxLength: 100
          example: "contacto@cafecentral.es"
        description:
          type: string
          maxLength: 500
          example: "Cafetería acogedora con productos ecológicos."
        imageLogo:
          type: string
          maxLength: 255
          example: "https://cdn.example.com/logo/cafecentral.png"
        createdAt:
          type: string
          format: date-time
          example: "2025-08-01T17:45:00"
        wifi:
          $ref: '#/components/schemas/WifiResponse'
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHourResponse'
        kitchenHours:
          type: array
          items:
            $ref: '#/components/schemas/KitchenHourResponse'
        facilities:
          type: array
